name: Daily Trend Tracker

on:
  schedule:
    - cron: "30 7 * * *"        # 07:30 UTC = 1:00 PM IST
  workflow_dispatch:
    inputs:
      skip_content:
        description: "কনটেন্ট ব্রিফ বাদ দিয়ে দ্রুত রান"
        type: boolean
        default: false
      only_categories:
        description: "শুধু নির্দিষ্ট ক্যাটাগরি (কমা দিয়ে), খালি = সব"
        required: false
        default: ""
      dry_run:
        description: "শিটে না লিখে শুধু লগে দেখাও"
        type: boolean
        default: false

concurrency:
  group: daily-trends
  cancel-in-progress: false

permissions:
  contents: write        # state/ ও data/ কমিট করার জন্য
  issues: write          # ব্যর্থ হলে issue খোলার জন্য

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: .httpcache
          key: httpcache-${{ github.run_id }}
          restore-keys: httpcache-

      - name: Collect → verify → publish
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID:        ${{ secrets.SHEET_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          TZ_NAME: Asia/Kolkata
          ONLY_CATEGORIES: ${{ github.event.inputs.only_categories }}
          SKIP_CONTENT: ${{ github.event.inputs.skip_content }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CONTENT_TOPICS: "15"
          REPEAT_BLOCK_DAYS: "5"
        run: python -m src.main

      - name: Commit state + daily snapshot
        if: always()
        run: |
          git config user.name  "trend-bot"
          git config user.email "actions@github.com"
          git add -A state data REPORT.md || true
          git diff --staged --quiet || git commit -m "chore: trends $(date -u +%F)"
          git push || echo "nothing to push"

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trends-${{ github.run_number }}
          path: data/
          retention-days: 30

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const t = `Trend run failed — ${new Date().toISOString().slice(0,10)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'automation-failure' });
            if (!existing.data.find(i => i.title === t)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title: t,
                labels: ['automation-failure'],
                body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            }
