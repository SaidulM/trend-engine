name: Daily Trend Tracker

on:
  schedule:
    - cron: "30 7 * * *"        # 07:30 UTC = 1:00 PM IST
  workflow_dispatch:
    inputs:
      skip_content:
        description: "কনটেন্ট ব্রিফ বাদ দিয়ে দ্রুত রান"
        type: boolean
        default: false
      only_categories:
        description: "শুধু নির্দিষ্ট ক্যাটাগরি (কমা দিয়ে), খালি = সব"
        required: false
        default: ""
      dry_run:
        description: "শিটে না লিখে শুধু লগে দেখাও"
        type: boolean
        default: false

concurrency:
  group: daily-trends
  cancel-in-progress: false

permissions:
  contents: write        # state/ ও data/ কমিট করার জন্য
  issues: write          # ব্যর্থ হলে issue খোলার জন্য

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Preflight — secrets যাচাই
        env:
          SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SID: ${{ secrets.SHEET_ID }}
        run: |
          miss=0
          [ -z "$SA" ]  && { echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON secret সেট করা নেই"; miss=1; }
          [ -z "$SID" ] && { echo "::error::SHEET_ID secret সেট করা নেই"; miss=1; }
          if [ "$miss" = "1" ]; then
            {
              echo "## ⚙️ সেটআপ এখনো সম্পূর্ণ হয়নি"
              echo ""
              echo "Settings → Secrets and variables → Actions → **New repository secret**"
              echo ""
              echo "| Secret | মান |"
              echo "|---|---|"
              echo "| \`GOOGLE_SERVICE_ACCOUNT_JSON\` | service-account JSON ফাইলের পুরো কনটেন্ট |"
              echo "| \`SHEET_ID\` | Google Sheet-এর URL থেকে ID |"
              echo "| \`GEMINI_API_KEY\` | aistudio.google.com/apikey (ফ্রি) |"
              echo ""
              echo "⚠️ এরপর service account-এর \`client_email\`-কে Google Sheet-এ **Editor** হিসেবে Share করতে ভুলো না।"
              echo ""
              echo "বিস্তারিত: [SETUP.md](../blob/main/SETUP.md)"
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✓ প্রয়োজনীয় secrets পাওয়া গেছে"

      - run: pip install -r requirements.txt

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: .httpcache
          key: httpcache-${{ github.run_id }}
          restore-keys: httpcache-

      - name: Collect → verify → publish
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID:        ${{ secrets.SHEET_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          TZ_NAME: Asia/Kolkata
          ONLY_CATEGORIES: ${{ github.event.inputs.only_categories }}
          SKIP_CONTENT: ${{ github.event.inputs.skip_content }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CONTENT_TOPICS: "15"
          REPEAT_BLOCK_DAYS: "5"
        run: python -m src.main

      - name: Commit state + daily snapshot
        if: always()
        run: |
          git config user.name  "trend-bot"
          git config user.email "actions@github.com"
          git add -A state data REPORT.md 2>/dev/null || git add -A state data || true
          git diff --staged --quiet || git commit -m "chore: trends $(date -u +%F) [skip ci]"
          git push || echo "nothing to push"

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trends-${{ github.run_number }}
          path: data/
          retention-days: 30

      - name: Report failure (একটাই issue, কমেন্ট যোগ হয়)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = '⚠️ Daily trend run is failing';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'automation-failure', per_page: 50 });
            const hit = open.data.find(i => i.title === TITLE);
            const body = `Run failed: ${url}\n\n_${new Date().toISOString()}_`;
            if (hit) {
              await github.rest.issues.createComment({ owner, repo, issue_number: hit.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: TITLE,
                labels: ['automation-failure'],
                body: `ডেইলি রান ব্যর্থ হচ্ছে।\n\n${body}\n\n` +
                      `সবচেয়ে সাধারণ কারণ: secrets সেট করা নেই, অথবা service account-এর ` +
                      `email Google Sheet-এ Editor হিসেবে Share করা হয়নি। দেখো SETUP.md।` });
            }

      - name: সফল হলে পুরনো failure issue বন্ধ করো
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'automation-failure', per_page: 50 });
            for (const i of open.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: i.number,
                body: '✅ পরবর্তী রান সফল হয়েছে — অটো ক্লোজ করা হলো।' });
              await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
            }
