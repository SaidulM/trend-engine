name: CI

on:
  push:
    paths-ignore:        # বটের দৈনিক ডেটা-কমিটে CI চালানোর দরকার নেই
      - 'data/**'
      - 'state/**'
      - 'REPORT.md'
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint (syntax + undefined names)
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Unit tests
        run: python -m pytest -q
      - name: Import smoke test
        run: python -c "import src.main, src.sheets, src.report, src.contentkit; print('all modules import OK')"
